name: secret-drawer-win

on:
  workflow_dispatch:
  push:
    paths:
      - "secret-drawer/**"
      - ".github/workflows/secret-drawer-win.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: secret-drawer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win nsis --x64
      - uses: actions/upload-artifact@v4
        with:
          name: secret-drawer-win-x64
          path: secret-drawer/dist/*.exe
          if-no-files-found: error
